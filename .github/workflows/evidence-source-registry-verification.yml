name: Evidence Source Registry Verification

on:
  workflow_dispatch:
  push:
    branches:
      - verify/evidence-source-registry-target

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test verifier contract
        run: node scripts/smoke-evidence-source-registry-verification.mjs

      - name: Check read-only query credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing GitHub secret or variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Build compiled Wrangler configuration
        run: npm run build

      - name: Resolve temporary target D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-production-d1-binding.mjs apps/web/dist/server/wrangler.json

      - name: Verify target source registry read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVIDENCE_SOURCE_REGISTRY_WRANGLER_CONFIG: apps/web/dist/server/wrangler.json
        run: node scripts/verify-evidence-source-registry-remote.mjs artifacts/evidence-source-registry-verification.json

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-source-registry-verification
          path: artifacts/evidence-source-registry-verification.json
          if-no-files-found: warn
          retention-days: 7
