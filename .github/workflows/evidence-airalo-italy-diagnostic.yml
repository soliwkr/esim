name: Evidence Airalo Italy Diagnostic

on:
  push:
    branches:
      - ops/evidence-airalo-italy-diagnostic

permissions:
  contents: read

env:
  AUTHORIZED_MAIN_SHA: 066fd6221d500fb54dfbdd6ee72d8115762754d1

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/evidence-airalo-italy-diagnostic"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$AUTHORIZED_MAIN_SHA"
          git merge-base --is-ancestor "$AUTHORIZED_MAIN_SHA" HEAD

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const marker = JSON.parse(readFileSync('ops/evidence-airalo-italy-diagnostic-authorization.json', 'utf8'));
          if (marker.operation !== 'airalo_italy_source_diagnostic') throw new Error('authorization_operation_invalid');
          if (marker.authorizedByUser !== true) throw new Error('authorization_missing');
          if (marker.expectedMainSha !== process.env.AUTHORIZED_MAIN_SHA) throw new Error('authorization_main_sha_mismatch');
          if (marker.sourceKey !== 'airalo-italy-plan') throw new Error('authorization_source_invalid');
          const scope = marker.scope ?? {};
          for (const key of ['officialSourceNetworkRead', 'diagnosticArtifactRetention']) {
            if (scope[key] !== true) throw new Error(`authorization_scope_missing:${key}`);
          }
          for (const key of ['extractorMutation', 'sourceIdentityMutation', 'replacementApproval', 'r2ObjectUpload', 'r2Mutation', 'd1Mutation', 'claimVerificationWrites', 'publication', 'affiliateActivation', 'productionDeploy']) {
            if (scope[key] !== false) throw new Error(`authorization_scope_invalid:${key}`);
          }
          NODE

          printf '%s\n' \
            '.github/workflows/evidence-airalo-italy-diagnostic.yml' \
            'ops/evidence-airalo-italy-diagnostic-authorization.json' \
            | sort > /tmp/expected-files
          git diff --name-only "$AUTHORIZED_MAIN_SHA"..HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture exact Airalo source without extraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/airalo-italy-diagnostic
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { AIRALO_EXACT_PACKAGE_URL, LIVE_SOURCE_CONFIG, captureLiveSource } from './scripts/run-italy-comparison-evidence-pack.mjs';
          import { htmlToVisibleText } from './scripts/italy-comparison-evidence-pack.mjs';

          const source = LIVE_SOURCE_CONFIG.find((entry) => entry.key === 'airalo-italy-plan');
          if (!source) throw new Error('airalo_source_missing');
          if (source.url !== AIRALO_EXACT_PACKAGE_URL) throw new Error('airalo_exact_url_drift');

          const captured = await captureLiveSource(source);
          const html = captured.body.toString('utf8');
          const visibleText = htmlToVisibleText(html);
          const lines = visibleText.split(/\n+/).map((line) => line.trim()).filter(Boolean);
          const interesting = lines.filter((line) => /italy|mamma|unlimited|10\s*day|10\s*gior|gb|€|eur/i.test(line)).slice(0, 120);
          const sha256 = createHash('sha256').update(captured.body).digest('hex');

          const snapshot = captured.snapshot;
          const summary = {
            schemaVersion: 1,
            diagnosticOnly: true,
            sourceKey: source.key,
            sourceAuditKey: source.sourceAuditKey,
            requestedUrl: source.url,
            finalUrl: snapshot.finalUrl ?? snapshot.canonicalFinalUrl ?? null,
            canonicalFinalUrl: snapshot.canonicalFinalUrl ?? null,
            httpStatus: snapshot.httpStatus ?? null,
            contentType: snapshot.contentType ?? null,
            locale: snapshot.locale ?? null,
            bodySha256: `sha256:${sha256}`,
            byteLength: captured.body.length,
            redirectChain: snapshot.redirectChain ?? [],
            interestingVisibleTextLines: interesting,
            replacementApproved: false,
            r2Uploaded: false,
            d1Mutated: false
          };

          await writeFile('artifacts/airalo-italy-diagnostic/airalo-italy-plan.html', captured.body);
          await writeFile('artifacts/airalo-italy-diagnostic/summary.json', `${JSON.stringify(summary, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: airalo-italy-source-diagnostic
          path: artifacts/airalo-italy-diagnostic/
          if-no-files-found: error
          retention-days: 7
