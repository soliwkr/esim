name: Evidence 0022 Remote Read-only Preflight

on:
  push:
    branches:
      - chore/evidence-0022-remote-readonly-preflight
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify fail-closed read-only contract
        run: npm run smoke:evidence-0022-remote-preflight

  remote-readonly-preflight:
    if: >-
      (github.event_name == 'push' &&
       github.ref_name == 'chore/evidence-0022-remote-readonly-preflight') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'chore/evidence-0022-remote-readonly-preflight' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: contract-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check read-only credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing GitHub secret or variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Build compiled Wrangler configuration
        run: npm run build

      - name: Resolve temporary target D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-production-d1-binding.mjs apps/web/dist/server/wrangler.json

      - name: Run 0022 remote read-only preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVIDENCE_0022_PREFLIGHT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_0022_PREFLIGHT_WRANGLER_CONFIG: apps/web/dist/server/wrangler.json
          EVIDENCE_CONTROLLED_INGEST_WRANGLER_CONFIG: apps/web/dist/server/wrangler.json
          EVIDENCE_SOURCE_REGISTRY_WRANGLER_CONFIG: apps/web/dist/server/wrangler.json
        run: npm run preflight:evidence-0022-remote

      - name: Upload deterministic preflight audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-0022-remote-readonly-preflight
          path: artifacts/evidence-0022-remote-readonly-preflight.json
          if-no-files-found: warn
          retention-days: 90
