name: Apply Airalo Europe Currency Drift Fix Once

on:
  push:
    branches:
      - fix/evidence-airalo-europe-source-currency-drift

permissions:
  contents: write

env:
  EXPECTED_MAIN_SHA: 1312ab5cd241c94a2eab72fb9698706292776c24

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/evidence-airalo-europe-source-currency-drift"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          printf '%s\n' \
            '.github/workflows/evidence-airalo-europe-fix-once.yml' \
            'scripts/apply-airalo-europe-drift-fix-once.mjs' \
            | sort > /tmp/expected-files
          git diff --name-only "$EXPECTED_MAIN_SHA"..HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact bounded patch
        run: node scripts/apply-airalo-europe-drift-fix-once.mjs

      - name: Verify patch and targeted smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          node scripts/smoke-europe-regional-evidence-pack.mjs

      - name: Commit exact code fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/europe-regional-evidence-pack.mjs scripts/smoke-europe-regional-evidence-pack.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "Handle Airalo Europe source-native currency drift"
          git push origin HEAD:fix/evidence-airalo-europe-source-currency-drift
