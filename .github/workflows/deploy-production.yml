name: Deploy Senza Roaming

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Canonical site URL
        required: true
        default: https://senzaroaming.it

concurrency:
  group: deploy-senza-roaming
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  SENZA_ROAMING_SITE_URL: ${{ inputs.site_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install browser for live consent smoke
        run: npx playwright install --with-deps chromium

      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing GitHub secret or variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Check Docker
        run: docker info

      - name: Generate Cloudflare binding types
        run: npm run types

      - name: Typecheck
        run: npm run typecheck

      - name: Verify production deploy inputs
        env:
          CMP_PROVIDER: ${{ secrets.CMP_PROVIDER || vars.CMP_PROVIDER }}
          CMP_EMBED_ID: ${{ secrets.CMP_EMBED_ID || vars.CMP_EMBED_ID }}
          GTM_ID: ${{ secrets.GTM_ID || vars.GTM_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID || vars.GA4_MEASUREMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run preflight:production-deploy
          for name in CMP_PROVIDER CMP_EMBED_ID GTM_ID GA4_MEASUREMENT_ID; do
            value="${!name}"
            echo "::add-mask::$value"
          done

      - name: Verify Control Room Access prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID" || { echo "Missing GitHub secret CF_ACCESS_CLIENT_ID"; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo "Missing GitHub secret CF_ACCESS_CLIENT_SECRET"; exit 1; }
          npx wrangler secret list --name senza-roaming --format json > /tmp/worker-secrets.json
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          const rows = Array.isArray(payload) ? payload : payload.result || [];
          const names = new Set(rows.map((item) => item.name));
          const required = ['MAINTENANCE_TOKEN', 'CF_ACCESS_TEAM_DOMAIN', 'CF_ACCESS_AUD'];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) throw new Error(`Missing Worker secrets: ${missing.join(', ')}`);
          NODE

      - name: Run canonical production deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMP_PROVIDER: ${{ secrets.CMP_PROVIDER || vars.CMP_PROVIDER }}
          CMP_EMBED_ID: ${{ secrets.CMP_EMBED_ID || vars.CMP_EMBED_ID }}
          GTM_ID: ${{ secrets.GTM_ID || vars.GTM_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID || vars.GA4_MEASUREMENT_ID }}
        run: npm run deploy

      - name: Verify live public production contracts
        env:
          CMP_PROVIDER: ${{ secrets.CMP_PROVIDER || vars.CMP_PROVIDER }}
          CMP_EMBED_ID: ${{ secrets.CMP_EMBED_ID || vars.CMP_EMBED_ID }}
          GTM_ID: ${{ secrets.GTM_ID || vars.GTM_ID }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID || vars.GA4_MEASUREMENT_ID }}
        run: npm run smoke:production-live

      - name: Verify live Control Room v3
        shell: bash
        run: |
          set -euo pipefail
          page_url="$SENZA_ROAMING_SITE_URL/control-room"
          script_url="$SENZA_ROAMING_SITE_URL/control-room.js?v=3"
          health_url="$SENZA_ROAMING_SITE_URL/api/health"

          for attempt in $(seq 1 36); do
            echo "Live smoke attempt $attempt/36"
            if curl --fail --silent --show-error --max-time 20 "$health_url" -o /tmp/health.json \
              && grep -q '"controlRoomVersion":3' /tmp/health.json \
              && curl --fail --silent --show-error --max-time 20 "$page_url" -o /tmp/control-room.html \
              && grep -q 'Control Room <span class="version">v3</span>' /tmp/control-room.html \
              && grep -q 'src="/control-room.js?v=3"' /tmp/control-room.html \
              && curl --fail --silent --show-error --max-time 20 "$script_url" -o /tmp/control-room.js \
              && node --check /tmp/control-room.js; then
              echo "Control Room v3 is live and the served JavaScript is syntactically valid."
              exit 0
            fi
            sleep 5
          done

          echo "Control Room v3 did not become healthy."
          exit 1

      - name: Verify live Access-protected Control Room foundation
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          page_url="$SENZA_ROAMING_SITE_URL/control-room-foundation"
          snapshot_url="$page_url/api/snapshot"

          anonymous_status="$(curl --silent --show-error --max-time 20 --output /tmp/control-room-anonymous.html --write-out '%{http_code}' "$page_url")"
          case "$anonymous_status" in
            302|401|403) ;;
            *)
              echo "Control Room foundation is not protected; anonymous status: $anonymous_status"
              exit 1
              ;;
          esac

          anonymous_snapshot_status="$(curl --silent --show-error --max-time 20 --output /tmp/control-room-snapshot-anonymous.html --write-out '%{http_code}' "$snapshot_url")"
          case "$anonymous_snapshot_status" in
            302|401|403) ;;
            *)
              echo "Control Room snapshot proxy is not protected; anonymous status: $anonymous_snapshot_status"
              exit 1
              ;;
          esac

          for attempt in $(seq 1 36); do
            echo "Access-authenticated smoke attempt $attempt/36"
            if curl --fail --silent --show-error --max-time 20 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -D /tmp/control-room-foundation.headers \
              "$page_url" -o /tmp/control-room-foundation.html \
              && grep -qi '^cache-control:.*no-store' /tmp/control-room-foundation.headers \
              && grep -qi '^x-robots-tag:.*noindex' /tmp/control-room-foundation.headers \
              && grep -q '<title>Control Room · Senza Roaming</title>' /tmp/control-room-foundation.html \
              && grep -q '<astro-island' /tmp/control-room-foundation.html \
              && curl --fail --silent --show-error --max-time 20 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H 'Accept: application/json' \
              -D /tmp/control-room-snapshot.headers \
              "$snapshot_url" -o /tmp/control-room-snapshot.json \
              && grep -qi '^cache-control:.*no-store' /tmp/control-room-snapshot.headers \
              && grep -qi '^x-robots-tag:.*noindex' /tmp/control-room-snapshot.headers \
              && grep -q '"ok":true' /tmp/control-room-snapshot.json \
              && grep -q '"publicationAutomation":false' /tmp/control-room-snapshot.json; then
              echo "Cloudflare Access, origin JWT validation and server-side snapshot proxy are active."
              exit 0
            fi
            sleep 5
          done

          echo "Access-protected Control Room foundation did not become healthy."
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "## Senza Roaming deployed"
            echo
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Worker: senza-roaming"
            echo "- D1: senza-roaming"
            echo "- Container: Last30DaysContainer"
            echo "- Workflow: senza-roaming-recent-demand"
            echo "- Schedule: Monday and Thursday at 05:00 UTC"
            echo "- Canonical URL: $SENZA_ROAMING_SITE_URL"
            echo "- Public routes: M7, preview, SEO, published-only, CMP and measurement verified"
            echo "- Legacy Control Room: v3 live-smoke verified"
            echo "- Astro Control Room: Access, origin JWT and server-side snapshot proxy verified"
            echo "- AI Gateway: senza-roaming-ai"
            echo "- Vertex project: soliwkr"
            echo "- Publication automation: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
