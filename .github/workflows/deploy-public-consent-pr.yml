name: Deploy public consent checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: senza-roaming-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.head_ref == 'ops/run-public-consent-deploy-now'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for consent smoke
        run: npx playwright install --with-deps chromium

      - name: Generate Cloudflare binding types
        run: npm run types

      - name: Typecheck
        run: npm run typecheck

      - name: Build production Worker
        run: npm run build

      - name: Verify isolated consent boundary
        run: npm run smoke:public-consent

      - name: Deploy CMP-only production build
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live consent boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const origin = 'https://senzaroaming.it';
          const embedId = 'f8ebd840-9f82-427c-a9b7-1425cb627a87';
          const embedUrl = `https://embeds.iubenda.com/widgets/${embedId}.js`;

          async function load(pathname, expectedStatus = 200) {
            let lastError;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const response = await fetch(`${origin}${pathname}`, {
                  headers: { 'cache-control': 'no-cache' },
                  redirect: 'manual',
                });
                const body = await response.text();
                if (response.status === expectedStatus) return { response, body };
                lastError = new Error(`${pathname}: expected ${expectedStatus}, got ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            throw lastError;
          }

          const home = await load('/');
          const privacy = await load('/privacy');
          const preview = await load('/astro-foundation');
          const health = await load('/api/health');
          const sitemap = await load('/sitemap.xml');
          const robots = await load('/robots.txt');

          for (const [pathname, body] of [['/', home.body], ['/privacy', privacy.body]]) {
            assert.equal(body.split(embedUrl).length - 1, 1, `${pathname} must contain exactly one iubenda embed.`);
            assert.match(body, /Gestisci preferenze cookie/);
            assert.doesNotMatch(body, /googletagmanager|google-analytics|doubleclick|googleadservices|gtag\(/i);
          }

          for (const [pathname, body] of [
            ['/astro-foundation', preview.body],
            ['/api/health', health.body],
            ['/sitemap.xml', sitemap.body],
            ['/robots.txt', robots.body],
          ]) {
            assert.doesNotMatch(body, /embeds\.iubenda\.com|iubenda-cs-preferences-link/i, `${pathname} must exclude the CMP.`);
          }

          assert.match(privacy.body, /iubenda è configurata; GTM e GA4 restano inattivi\./);
          console.log('Live CMP-only consent boundary verified.');
          NODE
