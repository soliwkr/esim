name: Evidence R2 Provisioning

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA authorized for R2 evidence provisioning
        required: true
        type: string
      confirmation:
        description: Type PROVISION_EVIDENCE_R2
        required: true
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}

      - name: Verify authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_main_sha }}"
          test "${{ inputs.confirmation }}" = "PROVISION_EVIDENCE_R2"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify provisioning contract
        run: node scripts/smoke-evidence-r2-provisioning-gate.mjs

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing GitHub secret or variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Read-only R2 preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/evidence-r2-provisioning-gate.mjs preflight artifacts/evidence-r2-preflight.json

      - name: Provision exact evidence bucket contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/evidence-r2-provisioning-gate.mjs provision artifacts/evidence-r2-provisioning.json

      - name: Verify R2 state read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/evidence-r2-provisioning-gate.mjs verify artifacts/evidence-r2-result.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-r2-provisioning
          path: artifacts/evidence-r2-*.json
          if-no-files-found: warn
          retention-days: 30
