name: Evidence Source Registry Remote Onboarding

on:
  push:
    branches:
      - ops/evidence-source-registry-onboarding-remote
    paths:
      - ops/evidence-source-registry-onboarding-remote-authorization.json

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test remote onboarding contract
        run: node scripts/smoke-evidence-source-registry-onboarding-remote.mjs

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing GitHub secret or variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Build compiled Wrangler configuration
        run: npm run build

      - name: Resolve temporary target D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-production-d1-binding.mjs apps/web/dist/server/wrangler.json

      - name: Execute authorized source_registry onboarding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVIDENCE_SOURCE_REGISTRY_WRANGLER_CONFIG: apps/web/dist/server/wrangler.json
          SOURCE_REGISTRY_REMOTE_MUTATION_ACK: AUTHORIZED_8_SOURCE_REGISTRY_INSERTS_2026_08_07
        run: >-
          node scripts/evidence-source-registry-onboarding-remote.mjs
          ops/evidence-source-registry-onboarding-remote-authorization.json
          artifacts/evidence-source-registry-onboarding-remote.json

      - name: Re-verify target registry independently read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVIDENCE_SOURCE_REGISTRY_WRANGLER_CONFIG: apps/web/dist/server/wrangler.json
        run: >-
          node scripts/verify-evidence-source-registry-remote.mjs
          artifacts/evidence-source-registry-verification-after-onboarding.json

      - name: Require 9 of 9 resolved after onboarding
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile('artifacts/evidence-source-registry-verification-after-onboarding.json', 'utf8'));
          if (result.manifestSourceCount !== 9 || result.counts.resolved !== 9 || result.counts.sourceNotRegistered !== 0 || result.counts.sourceRegistryAmbiguous !== 0 || result.readyForImporter !== true) {
            throw new Error(`post_onboarding_verification_failed:${JSON.stringify(result.counts)}`);
          }
          console.log('post-onboarding target verification: 9/9 exactly-one');
          NODE

      - name: Upload sanitized onboarding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-source-registry-onboarding-remote
          path: |
            artifacts/evidence-source-registry-onboarding-remote.json
            artifacts/evidence-source-registry-verification-after-onboarding.json
          if-no-files-found: warn
          retention-days: 14
